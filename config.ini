# Hoerspiel Player
# Beliebig viele path= Eintraege sind moeglich.
# Nicht vorhandene Pfade werden beim Start einfach ignoriert.

[storage]
path=/roms/hoerspiele
path=/roms2/hoerspiele
path=/mnt/usbdrive/hoerspiele

[hardware]
# -1 = automatische Erkennung beim ersten Start
led_gpio=-1
led_gpio_mode=auto


[ui]
# Dauerhafte Benutzeroberflaechen-/Systemeinstellungen
volume=128
idle_timer_minutes=0
display_timeout_seconds=60
# 0=Klein, 1=Normal, 2=Gross, 3=Sehr gross
menu_font_size=1

[playback]
# 0 = am Ende stoppen, 1 = Hoerspiel von vorn beginnen
repeat_book=0
shutdown_after_tracks=0
shutdown_at_book_end=0

[download]
# Downloads sind standardmaessig deaktiviert.
enabled=0
# Basis-URL des nginx XML-Listings, http oder https.
base_url=
# Lokales Ziel fuer heruntergeladene Hoerspiele.
target_path=/roms/hoerspiele
# TLS-Pruefung sollte normalerweise aktiviert bleiben.
verify_peer=1
verify_host=1
# Optional: eigene CA und mTLS Client-Zertifikat/Key.
ca_cert=
client_cert=
client_key=
client_key_password=

[bluetooth]
# Nur paired + trusted Geraete koennen im Player ausgewaehlt werden.
autoconnect=0
device=

[input]
# Standard: R36S. Ohne Anpassung bleibt das bisherige Verhalten erhalten.
profile=r36s
dpad_mode=buttons
dpad_up=8
dpad_down=9
dpad_left=10
dpad_right=11
# Nur fuer dpad_mode=axis relevant:
dpad_x_axis=0
dpad_y_axis=1
dpad_deadzone=16000

a=1
b=0
x=2
y=3
l1=4
r1=5
l2=6
r2=7
start=13
select=12

[streams]
# Lokaler Dateipfad oder http(s)-URL:
# xml_url=/roms/ports/Hoerspiel Player/stations.xml
xml_url=https://example.org/streams.xml
# none | downloads | separate
client_cert_mode=none
# Nur bei separate:
ca_cert=
client_cert=
client_key=
client_key_password=
